name: Build and deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DEPLOY_HOST: 187.124.137.131
  DEPLOY_USER: globallawyersforum
  APP_ROOT: /home/globallawyersforum/htdocs/globallawyersforum.org

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Create production environment
        shell: bash
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          test -n "$PRODUCTION_ENV"
          printf '%s\n' "$PRODUCTION_ENV" > .env.production
          chmod 600 .env.production

      - name: Install, validate, and build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Package standalone application
        shell: bash
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp ecosystem.config.cjs .next/standalone/ecosystem.config.cjs
          cp .env.production .next/standalone/.env.production
          tar -C .next/standalone -czf frontend-release.tgz .

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        shell: bash
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes frontend-release.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/glf-frontend-${GITHUB_SHA}.tgz"

      - name: Activate and verify release
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          command -v node >/dev/null
          command -v pm2 >/dev/null
          release="$APP_ROOT/releases/$RELEASE_SHA"
          archive="/tmp/glf-frontend-$RELEASE_SHA.tgz"
          previous="$(readlink -f "$APP_ROOT/current" 2>/dev/null || true)"
          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"
          rm -f "$archive"
          ln -sfn "$release" "$APP_ROOT/current.next"
          mv -Tf "$APP_ROOT/current.next" "$APP_ROOT/current"
          pm2 startOrReload "$APP_ROOT/current/ecosystem.config.cjs" --update-env
          sleep 3
          if ! curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
               http://127.0.0.1:3005/ >/dev/null; then
            echo "Health check failed! Displaying PM2 logs:"
            pm2 logs globallawyersforum --lines 50 --nostream || true
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              ln -sfn "$previous" "$APP_ROOT/current.next"
              mv -Tf "$APP_ROOT/current.next" "$APP_ROOT/current"
              pm2 startOrReload "$APP_ROOT/current/ecosystem.config.cjs" --update-env
            fi
            exit 1
          fi
          pm2 save
          find "$APP_ROOT/releases" -mindepth 1 -maxdepth 1 -type d -mtime +14 \
            ! -samefile "$APP_ROOT/current" -exec rm -rf -- {} +
          REMOTE
